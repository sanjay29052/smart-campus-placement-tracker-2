# Nginx Reverse Proxy Configuration for Smart Campus
server {
    listen 80;
    server_name your-ec2-domain-or-public-ip.compute-1.amazonaws.com;

    client_max_body_size 16M;

    # Static frontend assets
    location / {
        root /home/ubuntu/smart-campus/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to Gunicorn UNIX socket
    location /api {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/smart-campus/smartcampus.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
